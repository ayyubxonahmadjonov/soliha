<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06182f">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>Okean</title>
<link rel="preload" href="assets/fonts/Fraunces-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/okean.css?v=7">
</head>
<body>

<!-- The dive: the deeper it goes, the more of her there is, until it all settles into one shape. -->
<main class="sea" id="sea">
  <div class="sea__deep" id="deep"></div>
  <div class="rays" id="rays"></div>
  <div class="bloom" id="bloom"></div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="tiles" id="tiles"></div>
  <div class="shade"></div>

  <div class="say" aria-live="polite">
    <p class="ln" data-in="-3" data-out="2">Bitta rasmingizga qaragandim, xolos.</p>
    <p class="ln" data-in="4" data-out="9">Keyin yana bittasiga. Yana&hellip;</p>
    <p class="ln" data-in="11" data-out="15">Endi esa <em>cho‘kib ketyapman.</em></p>
  </div>
  <div class="end" id="end">
    <p class="end__t">Qutqarish shart emas.</p>
    <p class="end__s">Tinch okeanidan ham chuqur ekan.</p>
  </div>

  <div class="fin" id="fin">
    <p class="fin__hint">Rasmlarga bosib ko‘ring</p>
    <button class="btn" id="again" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>Yana bir bor</button>
  </div>
</main>

<!-- The surface: one tap is the dive, and the tap that lets the song play. -->
<button class="gate" id="gate" type="button" disabled aria-label="Sho‘ng‘ish">
  <span class="gate__moon"></span>
  <span class="gate__txt">
    <small>Soliha uchun</small>
    <b>Sho‘ng‘iymizmi?</b>
  </span>
  <span class="gate__water">
    <svg class="wave wave--3" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q75 0 150 30 T300 30 T450 30 T600 30 T750 30 T900 30 T1050 30 T1200 30 V60 H0Z"/></svg>
    <svg class="wave wave--2" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q75 4 150 30 T300 30 T450 30 T600 30 T750 30 T900 30 T1050 30 T1200 30 V60 H0Z"/></svg>
    <svg class="wave wave--1" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q75 8 150 30 T300 30 T450 30 T600 30 T750 30 T900 30 T1050 30 T1200 30 V60 H0Z"/></svg>
    <span class="gate__cta"><i></i><span id="gateMsg">Tayyorlanmoqda…</span></span>
    <span class="gate__bar"><i id="gateBar"></i></span>
    <span class="gate__sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>Ovozni balandroq qiling</span>
  </span>
</button>

<button class="resume" id="resume" type="button" hidden>Davom ettirish</button>
<div class="lb" id="lb" hidden></div>

<audio id="song" preload="auto" playsinline></audio>
<script src="js/media.js?v=1"></script>
<script src="js/okean.js?v=7"></script>
</body>
</html>
